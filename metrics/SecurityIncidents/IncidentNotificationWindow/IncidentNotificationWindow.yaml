name: "IncidentNotificationWindow"
description: "This rule assesses whether a [PolicyDocument] includes [SecurityIncident] with its [p1:notificationWindowHours] property set correctly."
implementationGuidelines:
  AMOE:
    question: "Does the procedure state a maximum notification window (e.g., 24-72 hours) consistent with the contract SLA?"
