# ====== Metadata ======
id: "6e3b8a15-9c4d-4f27-a061-d8b5c2f47913"
name: "IncidentReportingContactStated"
description: "This rule assesses whether a [PolicyDocument] includes [SecurityIncident] with its [p1:team] property set correctly."
implementationGuidelines:
  AMOE:
    question: "To whom must cybersecurity incidents affecting the company's services, applications, or IT systems be reported?"
    keywords: ["report to NovaBank", "notification contact", "designated contact", "CISO", "CISO's office", "the SOC", "SOC", "SOC team"]
category: "SecurityIncidents"
version: "v1"
comments: "This metric assesses if an incident reporting contact/team is defined. Added as a new dedicated metric rather than modifying the pre-existing IncidentReportingTeam metric, since that metric may be relied on by other consumers; this avoids any risk of changing its behavior."
# ====== Configuration ======
configuration:
  p1:
    operator: "=="
    targetValue: true
