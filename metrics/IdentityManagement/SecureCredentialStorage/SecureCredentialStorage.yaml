# ====== Metadata ======
id: SecureCredentialStorage

description: This rule assesses whether a [PolicyDocument] that offers the property [AccountManagementPolicy], has [p1:secretStorage] set correctly.
implementationGuidelines:
  AMOE: "Where are passwords, secrets or cryptographic keys stored?"
  is_headline_based: false
  keywords: ["storage", "passwords", "secretes"]
version: "1.0"

category: IdentityManagement
comments: This metric evaluates the length of passwords. It ensures that the length is set to a sensible minimum value of characters. Measured in months.
# ====== Configuration ======
configuration:
  p1:
    operator: "isIn"
    targetValue: ["password manager"]