# ====== Metadata ======
id: 6C6BAA12-C9EC-4586-B65A-4437FE0D9BB3
name: SecureCredentialStorage
description: This rule assesses whether a [PolicyDocument] that offers the property [AccountManagementPolicy], has [p1:secretStorage] set correctly.
implementationGuidelines:
  AMOE: 
    question: "Where are passwords, secrets or cryptographic keys stored?"
    is_headline_based: false
    keywords: ["storage", "passwords", "secretes"]
version: "1.0"

category: IdentityManagement
comments: This metric evaluates if the policy defines a tool to be used for secure storage of credentials.
# ====== Configuration ======
configuration:
  p1:
    operator: "isIn"
    targetValue: ["password manager"]
