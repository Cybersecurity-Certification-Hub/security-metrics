# ====== Metadata ======
id: "7c1e4a92-8f3d-4b6c-a2e1-9d5f8b3c6a10"
name: "TeleworkingTwoFactorRequired"
description: "This rule assesses whether a [PolicyDocument] on teleworking has its [p1:twoFactorRequired] property set correctly."
implementationGuidelines:
  AMOE:
    question: "Does the policy require two-factor authentication for teleworking/remote access?"
    keywords: ["two-factor authentication", "requires a two-factor authentication mechanism"]
category: "IdentityManagement"
version: "v1"
comments: "Teleworking access to internal systems over public networks must require two-factor authentication. Split out of the former combined TeleworkingSecurityControlsRequired metric (see TeleworkingEncryptionRequired for the encryption-only check) after AMOE's assessment could not map the combined 2FA-AND-encryption question correctly; both sub-checks share the same metric_id (AIM-01-M1) in the AMOE v2 spec since they test the same control from two independent angles."
# ====== Configuration ======
configuration:
  p1:
    operator: "=="
    targetValue: true
