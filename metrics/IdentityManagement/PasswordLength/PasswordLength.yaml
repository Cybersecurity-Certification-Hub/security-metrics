# ====== Metadata ======
id: 1B7E6E05-C1A4-4FB1-AA7E-D5E7D9044778
name: PasswordLength
description: This rule assesses whether a [PolicyDocument] that offers the property [PasswordBasedAuthentication], has [p1:length] set correctly.
implementationGuidelines:
  AMOE: 
    question: "How long should passwords be?"
    is_headline_based: false
    keywords: ["password", "length"]
version: "1.0"

category: IdentityManagement
comments: This metric evaluates if the policy defines the length of passwords. It ensures that the length is set to a sensible minimum value of characters. Measured in characters.
# ====== Configuration ======
configuration:
  p1:
    operator: ">="
    targetValue: 20 # defined in characters