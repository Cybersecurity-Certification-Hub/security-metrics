# ====== Metadata ======
id: "56e63981-b848-47e3-8122-f943bcb7bd18"
name: "ExternalAuditRecency"
description: "This rule assesses whether a [PolicyDocument] includes [ComplianceAuditIntervalPolicy] with its [p1:daysSinceLastAudit] property set correctly."
implementationGuidelines:
  AMOE:
    question: "Was the last completed audit within the last 24 months?"
    keywords: ["audit date", "last audit", "last completed audit"]
category: "Audit"
version: "v1"
comments: "The last completed external/supervisory audit must have occurred within the last 24 months (730 days). AMOE extracts the literal date (YYYY-MM-DD) from the sentence anchored on the phrase 'last completed audit'; the day-count itself is computed upstream during evidence collection and provided as daysSinceLastAudit, matching how every other interval-based AMOE metric in this repo receives a pre-computed number rather than parsing dates in REGO."
# ====== Configuration ======
configuration:
  p1:
    operator: "<="
    targetValue: 730
