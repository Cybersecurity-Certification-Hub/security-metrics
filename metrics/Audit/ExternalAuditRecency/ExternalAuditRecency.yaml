# ====== Metadata ======
id: "56e63981-b848-47e3-8122-f943bcb7bd18"
name: "ExternalAuditRecency"
description: "This rule assesses whether a [PolicyDocument] representing the audit clause has its [p1:daysSinceLastAudit] set correctly."
implementationGuidelines:
  AMOE:
    question: "Was the last completed audit within the last 24 months?"
    keywords: ["audit date", "last audit", "last completed audit"]
category: "Audit"
version: "v1"
comments: "The last completed external/supervisory audit must have occurred within the last 24 months (730 days). AMOE extracts the literal date (YYYY-MM-DD) from the sentence anchored on the phrase 'last completed audit' rather than judging the 24-month window itself; the date-parsing and 730-day threshold comparison happen in this metric's REGO policy, not in AMOE."
# ====== Configuration ======
configuration:
  p1:
    operator: "<="
    targetValue: 730
