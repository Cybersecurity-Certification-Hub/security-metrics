# ====== Metadata ======
id: "36c18abe-1f99-41a4-9924-945a04af81c1"
name: "AssetInventoryDefined"
description: "This rule assesses whether a [PolicyDocument] includes [AssetInventory] with its [p1:inventoryDefined] property set correctly."
implementationGuidelines:
  AMOE:
    question: "Does the policy define an Asset Inventory?"
    keywords: ["asset inventory", "Asset Inventory", "maintains a complete Asset Inventory"]
category: "AssetManagement"
version: "v1"
comments: "The policy must define an Asset Inventory. Split out of the former combined AssetGovernancePolicyDocumented metric, which bundled Asset Inventory, Asset Ownership, and Information Classification into a single yes/no question AMOE could not answer; the Asset Ownership check now lives in AssetOwnershipAssignmentStated. The Information Classification check is not part of the final AMOE assessment scope for this control and has been dropped rather than carried forward as a metric AMOE cannot evaluate."
# ====== Configuration ======
configuration:
  p1:
    operator: "=="
    targetValue: true
