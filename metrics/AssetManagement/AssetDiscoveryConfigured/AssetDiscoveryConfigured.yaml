# ====== Metadata ======
id: "4991c360-7fda-4d0d-b59e-0a93581b5a12"
name: "AssetDiscoveryConfigured"
description: "This rule assesses whether automated asset discovery is configured."
implementationGuidelines:
  Manual:
    question: "Is automated asset discovery configured?"
    keywords: ["asset discovery", "auto discovery", "inventory automation", "discovery tool"]
    guidance: "Check the configuration of the discovery tool: that it runs regularly without manual action and that its scope covers the systems in scope, for example the cloud accounts and networks. A one-off scan does not count."
    evidence:
      - "An export or screenshot of the discovery configuration with its schedule and scope"
      - "The result of the last discovery run"
      - "The list of connected sources, for example cloud accounts or network ranges"
category: "AssetManagement"
version: "v1"
comments: "Answer true if assets are discovered automatically, on a schedule, in the whole scope of the assessment."
# ====== Configuration ======
configuration:
  p1:
    operator: "=="
    targetValue: true
