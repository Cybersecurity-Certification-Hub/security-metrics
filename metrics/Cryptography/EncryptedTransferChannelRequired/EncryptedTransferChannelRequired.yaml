name: "EncryptedTransferChannelRequired"
description: "This rule assesses whether a [PolicyDocument] includes [CryptographicTransferPolicy] with its [p1:encryptedChannelRequired] property set correctly."
implementationGuidelines:
  AMOE:
    question: "Does the policy require encrypted channels (sFTP/HTTPS) for data transmission/reception?"
