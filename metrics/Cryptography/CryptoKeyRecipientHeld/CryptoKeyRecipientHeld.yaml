# ====== Metadata ======
id: "a4b8f1e6-3d2c-4f7a-9e5b-6c1d8a3f0b27"
name: "CryptoKeyRecipientHeld"
description: "This rule assesses whether a [PolicyDocument] includes [CryptographicTransferPolicy] with its [p1:recipientHeldKeyRequired] property set correctly."
implementationGuidelines:
  AMOE:
    question: "Who must hold the encryption key used to protect the file?"
    keywords: ["key known by the recipient", "recipient"]
category: "Cryptography"
version: "v1"
comments: "The policy must require the encryption key to be known by the recipient. Split out of the former combined KeyCustodyAndFileNamingControlled metric (see CryptoFilenameRestricted for the file-naming check)."
# ====== Configuration ======
configuration:
  p1:
    operator: "=="
    targetValue: true
